---
extends: default

rules:
  document-start: disable

  line-length:
    max: 148
    allow-non-breakable-inline-mappings: true

  truthy: disable

  new-lines: disable

  comments: disable

  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1

  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false

  empty-lines:
    max: 1
    max-start: 0
    max-end: 0
