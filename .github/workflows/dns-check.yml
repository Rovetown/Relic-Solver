name: DNS and edge check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      - name: Check delegation, records and edge headers
        run: bash scripts/check-dns.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Check the Cloudflare ranges baked into app.py
        continue-on-error: true
        run: uv run python scripts/check_cloudflare_ips.py
