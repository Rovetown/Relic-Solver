name: PR Validation

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install JS dependencies
        run: npm ci
      - name: Fix Permissions
        run: chmod +x node_modules/.bin/postcss node_modules/.bin/esbuild
      - name: Verify asset build
        run: npm run build
      - name: Test JS helpers
        run: npm run test-js
      - name: Install oxlint
        env:
          OXLINT_VERSION: '1.84.0'
        run: |
          base=https://github.com/oxc-project/oxc/releases/download
          asset=oxlint-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfL "$base/apps_v${OXLINT_VERSION}/$asset" | tar xz -C /tmp
          sudo install -m 0755 /tmp/oxlint-x86_64-unknown-linux-gnu /usr/local/bin/oxlint
          oxlint --version
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-
      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-26.04
    needs: lint
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Run tests
        run: |
          mkdir -p reports
          uv run pytest -m "not benchmark and not browser" \
            --json-report --json-report-file=reports/test_results.json
      - name: Generate test visualizations
        if: always()
        run: |
          mkdir -p reports/visuals
          uv run python scripts/visualize_test_suite.py reports/test_results.json -o reports/visuals/test_suite
          uv run python scripts/visualize_test_accuracy.py -o reports/visuals/accuracy
          uv run python scripts/visualize_cross_validation.py -o reports/visuals/cross_validation
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-pr
          path: |
            tests/reports/
            reports/visuals/
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-26.04
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Install the browser engines
        run: uv run playwright install --with-deps chromium firefox webkit
      - name: Run the browser suite on all three engines
        run: |
          uv run pytest tests/browser -m browser --no-cov             --browser chromium --browser firefox --browser webkit
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-pr
          path: test-results/
          if-no-files-found: ignore

  benchmark:
    runs-on: ubuntu-26.04
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Restore main benchmark baseline
        id: baseline
        uses: actions/cache/restore@v6
        with:
          path: .benchmarks/
          key: benchmark-baseline-
          restore-keys: benchmark-baseline-
      - name: Run benchmarks
        run: uv run pytest --benchmark-enable --benchmark-only --no-cov --benchmark-save=pr -v
      - name: Compare against baseline
        if: steps.baseline.outputs.cache-hit == 'true'
        run: |
          baseline=$(ls .benchmarks/*/0001_*.json 2>/dev/null | head -1)
          if [ -z "$baseline" ]; then
            echo "::warning::No baseline saved for this platform yet; skipping comparison."
            exit 0
          fi
          echo "Comparing against $baseline"
          uv run pytest --benchmark-enable --benchmark-only --no-cov \
            --benchmark-compare=0001 \
            --benchmark-compare-fail=median:50% -v
      - name: Generate benchmark visualization
        if: always()
        run: uv run python scripts/visualize_benchmarks.py .benchmarks/ -o reports/visuals/benchmarks
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-pr
          path: |
            .benchmarks/
            reports/visuals/benchmarks/
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Audit Python dependencies
        run: uv run --no-dev --with pip-audit pip-audit
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Audit JS dependencies
        run: npm audit --audit-level=high

  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint the Dockerfile
        run: |
          docker run --rm -i \
            -v "$PWD/.hadolint.yaml:/tmp/hadolint.yaml:ro" \
            hadolint/hadolint:v2.15.1-alpine \
            hadolint --config /tmp/hadolint.yaml - < Dockerfile
      - name: Build the container image
        run: docker build -t relic-solver:ci .
      - name: Scan the image for known vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/tmp/.trivyignore.yaml:ro" \
            aquasec/trivy:0.74.0 image --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /tmp/.trivyignore.yaml relic-solver:ci
